name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
      - run: python -m pip install --upgrade pip pytest ruff grpcio protobuf
      - run: python -m compileall -q custom_components/xray_api
      - run: python -m pytest tests
      - run: ruff check .
      - run: git diff --check

  runtime-minimum:
    name: Home Assistant runtime compatibility floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
      - run: python -m pip install --upgrade pip pytest grpcio==1.78.0 protobuf==6.32.0
      - run: python -m compileall -q custom_components/xray_api
      - run: python -m pytest tests/test_api.py tests/test_grpc_smoke.py
