name: "[Validate] HACS + Hassfest"

on:
  push:
    branches:
      - main
      - beta
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    name: HACS validation
    if: >-
      ${{ !(
        (github.event_name == 'push' &&
          (github.ref_name == 'release-please--branches--main' ||
            github.ref_name == 'release-please--branches--beta')) ||
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (github.head_ref == 'release-please--branches--main' ||
            github.head_ref == 'release-please--branches--beta'))
      ) }}
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    name: Hassfest validation
    if: >-
      ${{ !(
        (github.event_name == 'push' &&
          (github.ref_name == 'release-please--branches--main' ||
            github.ref_name == 'release-please--branches--beta')) ||
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (github.head_ref == 'release-please--branches--main' ||
            github.head_ref == 'release-please--branches--beta'))
      ) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
